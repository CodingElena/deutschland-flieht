<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Länder ausbluten</title>
  <style>
    @font-face{font-family:Inter;src:url('./assets/inter-normal.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:block}
    html,body{margin:0;background:#101011;overflow:hidden}
    canvas{display:block}
  </style>
</head>
<body>
  <canvas id="rec" width="3240" height="2909"></canvas>
  <svg id="measure" width="0" height="0" aria-hidden="true"></svg>
  <script>
    const svgNS = 'http://www.w3.org/2000/svg';
    const format = new Intl.NumberFormat('de-DE');
    const view = { x: -90, y: -8, w: 880, h: 790 };
    const desktop = {
      us: { path: 'M 197 195 C 166 160 126 123 96 103', nameX: 75, nameY: 42, valueX: 75, valueY: 69, anchor: 'end', originX: 197, originY: 195 },
      ch: { path: 'M 474 182 C 511 160 545 144 578 130', nameX: 596, nameY: 90, valueX: 596, valueY: 117, anchor: 'start', originX: 474, originY: 182 },
      es: { path: 'M 191 591 C 148 614 92 638 52 651', nameX: 48, nameY: 687, valueX: 48, valueY: 716, anchor: 'middle', originX: 191, originY: 591 },
      at: { path: 'M 443 628 C 488 640 528 642 548 636', nameX: 576, nameY: 642, valueX: 576, valueY: 674, anchor: 'start', originX: 443, originY: 628 },
    };

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function lengthOf(d) {
      const path = document.createElementNS(svgNS, 'path');
      path.setAttribute('d', d);
      document.getElementById('measure').append(path);
      return path.getTotalLength();
    }

    function endTangent(d) {
      const n = d.match(/-?\d+(?:\.\d+)?/g).map(Number);
      return { x: n[6], y: n[7], c2x: n[4], c2y: n[5] };
    }

    function drawChevron(ctx, tip) {
      const dx = tip.x - tip.c2x;
      const dy = tip.y - tip.c2y;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len;
      const uy = dy / len;
      ctx.beginPath();
      ctx.moveTo(tip.x - ux * 9 + -uy * 5.2, tip.y - uy * 9 + ux * 5.2);
      ctx.lineTo(tip.x, tip.y);
      ctx.lineTo(tip.x - ux * 9 - -uy * 5.2, tip.y - uy * 9 - ux * 5.2);
      ctx.stroke();
    }

    function drawLabel(ctx, text, x, y, anchor, size, weight) {
      ctx.save();
      ctx.font = `${weight} ${size}px Inter, Arial, sans-serif`;
      ctx.textAlign = anchor === 'end' ? 'right' : anchor === 'middle' ? 'center' : 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.lineJoin = 'round';
      ctx.lineWidth = size > 18 ? 4 : 3.4;
      ctx.strokeStyle = '#111114';
      ctx.strokeText(text, x, y);
      ctx.fillStyle = '#f6f6f6';
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    async function main() {
      const data = await (await fetch('./map-data.json')).json();
      await document.fonts.load('600 21px Inter');
      await document.fonts.load('500 16px Inter');
      const states = data.states.map((state) => ({ ...state, path: new Path2D(state.path) }));
      const arrows = data.destinations.map((destination) => {
        const layout = desktop[destination.id];
        return {
          ...destination,
          ...layout,
          shape: new Path2D(layout.path),
          length: lengthOf(layout.path),
          tip: endTangent(layout.path),
        };
      });

      const canvas = document.getElementById('rec');
      const ctx = canvas.getContext('2d', { alpha: false });
      const scale = canvas.width / view.w;
      canvas.height = Math.ceil(view.h * scale);

      const progress = 1;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#101011';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.setTransform(scale, 0, 0, scale, -view.x * scale, -view.y * scale);

      for (const state of states) {
        ctx.fillStyle = 'rgba(180, 35, 42, 0.38)';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.42)';
        ctx.lineWidth = 1.15;
        ctx.lineJoin = 'round';
        ctx.fill(state.path, 'evenodd');
        ctx.stroke(state.path);
      }

      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(240, 240, 242, 0.9)';
      ctx.lineWidth = 1.65;
      for (const arrow of arrows) {
        ctx.setLineDash([]);
        ctx.stroke(arrow.shape);
        ctx.save();
        ctx.lineWidth = 1.6;
        ctx.strokeStyle = '#f4f4f4';
        drawChevron(ctx, arrow.tip);
        ctx.beginPath();
        ctx.arc(arrow.originX, arrow.originY, 3, 0, Math.PI * 2);
        ctx.fillStyle = '#ed1018';
        ctx.fill();
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.restore();
        drawLabel(ctx, arrow.name.toUpperCase(), arrow.nameX, arrow.nameY, arrow.anchor, 21, 600);
        drawLabel(ctx, format.format(arrow.value), arrow.valueX, arrow.valueY, arrow.anchor, 16, 500);
      }
      ctx.restore();
      document.title = 'DONE';
    }

    main().catch((error) => {
      document.title = 'FAIL ' + error.message;
    });
  </script>
</body>
</html>
