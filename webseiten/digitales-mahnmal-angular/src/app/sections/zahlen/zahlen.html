<section class="zn surface-ink inset" aria-label="Die Zahlen">
  <figure class="zn__reihe" appReveal>
    <figcaption class="zn__reihe-kopf">
      <h2 class="zn__reihe-titel">{{ wanderung.titel }}</h2>
    </figcaption>

    <div class="zn__kurven" [attr.aria-label]="wanderung.titel">
      <p class="zn__kurve-name t-micro">Fortzüge</p>
      <svg class="zn__kurve" viewBox="0 0 720 110" aria-hidden="true">
        <path [attr.d]="fortzugPfad" />
      </svg>
      <p class="zn__kurve-name t-micro">Netto, nach Rückkehr</p>
      <svg class="zn__kurve zn__kurve--saldo" viewBox="0 0 720 110" aria-hidden="true">
        <path [attr.d]="saldoPfad" />
        <circle [attr.cx]="saldoEnde.x" [attr.cy]="saldoEnde.y" r="4" />
      </svg>
      <ol class="zn__jahre">
        @for (j of jahre; track j.jahr) {
          <li>{{ j.jahr }}</li>
        }
      </ol>
      <a class="zn__fnref" href="#zn-fn-1" id="zn-ref-1"><sup>1</sup></a>
    </div>

    <table class="zn__tabelle sr-only">
      <caption>
        Fortzüge und Wanderungssaldo deutscher Staatsangehöriger, {{ jahre[0].jahr }} bis
        {{ jahre[jahre.length - 1].jahr }}
      </caption>
      <thead>
        <tr>
          <th scope="col">Jahr</th>
          <th scope="col">Fortzüge</th>
          <th scope="col">Saldo</th>
        </tr>
      </thead>
      <tbody>
        @for (j of jahre; track j.jahr) {
          <tr>
            <th scope="row">{{ j.jahr }}</th>
            <td>{{ betrag(j.fortzuege) }}</td>
            <td>{{ j.saldo.toLocaleString('de-DE') }}</td>
          </tr>
        }
      </tbody>
    </table>
  </figure>

  @for (v of vignetten; track v.id; let i = $index) {
    <figure class="zn__vignette" appReveal [appRevealDelay]="i * 150">
      <figcaption class="zn__reihe-kopf">
        <h2 class="zn__reihe-titel">{{ v.titel }}</h2>
      </figcaption>

      <div class="zn__raster">
        <div class="zn__kreis">
          <img [src]="v.bild.pfad" [alt]="v.bild.alt" loading="lazy" decoding="async" />
          <div class="zn__kreis-inhalt">
            <p class="zn__wert"><app-zaehlwert [wert]="v.kennzahl.wert" /></p>
            <p class="zn__label">{{ v.kennzahl.label }}</p>
          </div>
        </div>
      </div>
    </figure>
  }

  <figure class="zn__keil" appReveal>
    <figcaption class="zn__reihe-kopf">
      <h2 class="zn__reihe-titel">{{ vergleich.titel }}</h2>
    </figcaption>

    <div class="zn__keil-grafik">
      <ul class="zn__balken">
        @for (land of balken; track land.id) {
          <li class="zn__balken-zeile" [class.zn__balken-zeile--hier]="land.hier">
            <span class="zn__balken-name">{{ land.name }}</span>
            <span class="zn__balken-spur">
              <span class="zn__balken-fill" [style.width.%]="land.breite"></span>
            </span>
            <span class="zn__balken-wert">{{ land.wert }}</span>
          </li>
        }
      </ul>
      <a class="zn__fnref" href="#zn-fn-2" id="zn-ref-2"><sup>2</sup></a>
    </div>
  </figure>

  <!-- Die Reihe endet hier, nicht die Datenlage: der Rest steht auf einer
       eigenen Seite, mit Quelle unter jeder Grafik. -->
  <p class="zn__weiter" appReveal>
    <a class="zn__weiter-link ghost-link" [routerLink]="weiter.pfad">{{ weiter.weiterLabel }}</a>
  </p>
</section>
