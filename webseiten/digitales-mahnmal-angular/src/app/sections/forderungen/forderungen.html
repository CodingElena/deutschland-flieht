<section class="fo surface-ink inset" aria-labelledby="fo-titel">
  <header class="fo__kopf">
    <h2 id="fo-titel" class="fo__titel">
      <span class="fo__titel-zeile">{{ sektion.titelZeile1 }}</span>
      <span class="fo__titel-zeile t-italic">{{ sektion.titelZeile2Kursiv }}</span>
    </h2>
    <p class="fo__einleitung">{{ sektion.einleitung }}</p>
  </header>

  <ul class="fo__raster">
    @for (f of forderungen; track f.id; let i = $index) {
      <!-- Gestaffelt: die Karten treten nacheinander auf, nicht als Block. -->
      <li class="fo__karte" appReveal [appRevealDelay]="i * 110">
        <div class="fo__bildrahmen" aria-hidden="true">
          <img
            class="fo__bild"
            [src]="f.bild.pfad"
            alt=""
            loading="lazy"
            decoding="async"
          />
        </div>

        <!-- Schleier: nach unten hin dicht, damit der Text auf dem Gesicht
             liest, oben offen, damit das Porträt noch Porträt bleibt. -->
        <span class="fo__schleier" aria-hidden="true"></span>

        <span class="fo__nummer" aria-hidden="true">{{ nummer(i) }}</span>

        <div class="fo__inhalt">
          <h3 class="fo__karte-titel">{{ f.titel }}</h3>
          <p class="fo__text">{{ f.text }}</p>
        </div>
      </li>
    }
  </ul>
</section>
