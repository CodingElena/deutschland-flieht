<!-- Der Film ist der Auftakt: eine belebte Straße, die Leute
     verschwinden. Das letzte Bild bleibt stehen. Darauf die Wortmarke,
     danach die Zahl. -->
<section class="hero surface-ink" [attr.data-akt]="akt()">
  <video
    #film
    class="hero__film"
    [src]="hero.film.pfad"
    muted
    autoplay
    playsinline
    preload="auto"
    disablepictureinpicture
    [attr.aria-label]="hero.film.beschreibung"
  ></video>

  <div class="hero__schleier" aria-hidden="true"></div>

  <div class="hero__cluster inset">
    <dl class="hero__stats">
      @for (k of hero.stats; track k.label) {
        <div class="hero__stat">
          <dt class="hero__stat-label">{{ k.kurzLabel }} {{ k.jahr }}</dt>
          <dd class="hero__stat-wert">
            @if (zahlSichtbar()) {
              <app-zaehlwert [wert]="k.wert" [dauer]="zaehlDauer" />
            }
          </dd>
        </div>
      }
    </dl>
    <a class="hero__daten ghost-link" [routerLink]="daten.pfad">{{ daten.startLabel }}</a>
  </div>

  <!-- Die Wortmarke trägt den Seitentitel. Sie steht auf der leeren
       Straße und sinkt beim Scrollen nach unten weg. -->
  <h1 class="hero__marke" [style.--sink]="markeVersatz() + 'px'">
    <span class="hero__wort">{{ marke.wortmarke }}</span>
    <span class="hero__verb">{{ marke.wortmarkeVerb }}</span>
  </h1>

  <div class="hero__atem" aria-hidden="true"></div>
</section>
