<!-- Nacht statt Papier: der Hero oeffnet das Mahnmal, nicht eine Galerie.
     Dunkle Flaeche, helle Schrift, die Skyline als Kulisse darunter. -->
<section class="hero surface-ink">
  <div class="hero__cluster inset">
    <!-- Die Fortzuege sind das Signal des Heros: ein Counter, der hochzaehlt. -->
    <dl class="hero__stats">
      @for (k of hero.stats; track k.label) {
        <div class="hero__stat">
          <dt class="hero__stat-label">{{ k.kurzLabel }} {{ k.jahr }}</dt>
          <dd class="hero__stat-wert"><app-zaehlwert [wert]="k.wert" [dauer]="900" /></dd>
        </div>
      }
    </dl>
    <a class="hero__daten ghost-link" [routerLink]="daten.pfad">{{ daten.startLabel }}</a>
  </div>

  <!-- Die Wortmarke traegt den Seitentitel. Sie ruht auf der Oberkante des
       Gemaeldes und sinkt beim Scrollen dahinter weg. -->
  <h1 class="hero__marke" [style.transform]="'translateY(' + markeVersatz() + 'px)'">
    <span class="hero__wort">{{ marke.wortmarke }}</span>
    <span class="hero__verb">{{ marke.wortmarkeVerb }}</span>
  </h1>

  <!-- Das Gemaelde traegt die untere Bildhaelfte; die Wortmarke steigt
       daraus auf. Bewusst hoch geladen, es ist das erste sichtbare Bild.
       Die Leinwand legt sich darueber und loescht nach und nach Fenster. -->
  <div class="hero__bild" #bildflaeche>
    <img
      #aufnahme
      [src]="hero.bild.pfad"
      [alt]="hero.bild.alt"
      fetchpriority="high"
      decoding="async"
    />
    <canvas
      class="hero__leinwand"
      [class.hero__leinwand--aktiv]="leinwandAktiv()"
      #leinwand
      aria-hidden="true"
    ></canvas>
  </div>
</section>
