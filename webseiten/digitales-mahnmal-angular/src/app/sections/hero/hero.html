<!-- Fünf Gesichter öffnen das Mahnmal. Kurz danach das Zitat.
     Dann wird jede Kachel zur leeren Silhouette. Kurz bleibt nur
     Schwarz. Danach schlägt die Wortmarke ein, und die Zahl folgt. -->
<section
  class="hero surface-ink"
  [class.hero--geht]="geht()"
  [attr.data-akt]="akt()"
  [style.--staffel]="staffelMs + 'ms'"
  [style.--verblassen]="verblassenMs + 'ms'"
>
  <div class="hero__wand" #wand aria-hidden="true">
    @for (kachel of kacheln; track kachel.id) {
      <figure class="hero__gesicht" [style.--verzug]="kachel.verzug">
        <img #aufnahme [src]="kachel.pfad" alt="" decoding="async" />
        <canvas #silhouette class="hero__silhouette"></canvas>
      </figure>
    }
  </div>

  <div class="hero__auftritt">
    <p class="hero__spruch">
      <span class="hero__satz">{{ hero.spruch.liebe }}</span>
      <span class="hero__satz">{{ hero.spruch.verlassen }}</span>
    </p>
  </div>

  <div class="hero__cluster inset">
    <dl class="hero__stats">
      @for (k of hero.stats; track k.label) {
        <div class="hero__stat">
          <dt class="hero__stat-label">{{ k.kurzLabel }} {{ k.jahr }}</dt>
          <dd class="hero__stat-wert">
            @if (zahlSichtbar()) {
              <app-zaehlwert [wert]="k.wert" [dauer]="zaehlDauer" />
            }
          </dd>
        </div>
      }
    </dl>
    <a class="hero__daten ghost-link" [routerLink]="daten.pfad">{{ daten.startLabel }}</a>
  </div>

  <!-- Die Wortmarke traegt den Seitentitel. Sie steht im Schwarz und
       sinkt beim Scrollen nach unten weg. -->
  <h1 class="hero__marke" [style.--sink]="markeVersatz() + 'px'">
    <span class="hero__wort">{{ marke.wortmarke }}</span>
    <span class="hero__verb">{{ marke.wortmarkeVerb }}</span>
  </h1>

  <div class="hero__atem" aria-hidden="true"></div>
</section>
